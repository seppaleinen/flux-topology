[project]
name = "flux-topology"
version = "0.3.7"
description = "Static dependency/topology graph of a FluxCD GitOps repo, exposed to AI agents on demand via a CLI and skill."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Daveri" }]
keywords = ["fluxcd", "gitops", "kubernetes", "topology", "dependency-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
render = []  # Vendored JS included; this is a placeholder for documentation

[project.urls]
Homepage = "https://github.com/seppaleinen/flux-topology"
Repository = "https://github.com/seppaleinen/flux-topology"
Issues = "https://github.com/seppaleinen/flux-topology/issues"

[project.scripts]
flux-topology = "flux_topology.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_topology"]
artifacts = [
    "src/flux_topology/viz/assets/vis-network.min.js",
    "src/flux_topology/viz/assets/vis-network.min.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
